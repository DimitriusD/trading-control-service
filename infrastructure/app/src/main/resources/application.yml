server:
  port: ${APP_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  health:
    circuitbreakers:
      enabled: true

integrations:
  api:
    marketDataService:
      url: ${MARKET_DATA_SERVICE_BASE_URL:http://localhost:8080}
      connectTimeout: ${MARKET_DATA_SERVICE_CONNECT_TIMEOUT:2s}
      readTimeout: ${MARKET_DATA_SERVICE_READ_TIMEOUT:5s}
    marketCatalogService:
      url: ${MARKET_CATALOG_SERVICE_BASE_URL:http://localhost:8097}
      connectTimeout: ${MARKET_CATALOG_SERVICE_CONNECT_TIMEOUT:2s}
      readTimeout: ${MARKET_CATALOG_SERVICE_READ_TIMEOUT:5s}

resilience4j:
  retry:
    instances:
      market-data-read:
        wait-duration: 200ms
        ignore-exceptions:
          - com.trading.control.application.domain.exception.NotFoundException
          - com.trading.control.application.domain.exception.ValidationException
      market-catalog-read:
        wait-duration: 200ms
        ignore-exceptions:
          - com.trading.control.application.domain.exception.NotFoundException
          - com.trading.control.application.domain.exception.ValidationException
  circuitbreaker:
    instances:
      market-data-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - com.trading.control.application.domain.exception.NotFoundException
          - com.trading.control.application.domain.exception.ValidationException
      market-catalog-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - com.trading.control.application.domain.exception.NotFoundException
          - com.trading.control.application.domain.exception.ValidationException
