# Create-or-replace a stream by selecting a catalog instrument. The UI sends the
# canonical instrumentId; control-service resolves the full instrument identity
# from market-catalog-service before forwarding to market-data-service.
type: object
required:
  - instrumentId
  - desiredState
  - channels
properties:
  instrumentId:
    type: string
    example: "BINANCE|SPOT|BTC|USDT"
  desiredState:
    $ref: "./StreamState.yaml"
  channels:
    type: array
    minItems: 1
    items:
      $ref: "../channel/ChannelSelection.yaml"
